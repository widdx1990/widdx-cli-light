[project]
name = "widdx-nexus"
version = "3.2.0"
description = "WIDDX Nexus — Terminal AI Workspace | By MUHAMMAD MUSLIH (widdx.com)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "chat", "cli", "tui", "terminal", "widdx", "assistant", "nexus", "agent"]

authors = [
    {name = "MUHAMMAD MUSLIH", email = "muhammed@widdx.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

dependencies = [
    "rich>=13.0",
    "httpx>=0.25",
    "textual>=1.0",
    "prompt_toolkit>=3.0",
    "pygments>=2.15",
    "python-bidi>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
gguf = ["llama-cpp-python>=0.2.0"]
all = ["widdx-nexus[dev,gguf,voice,gateway]"]
voice = ["edge-tts"]
gateway = ["python-telegram-bot", "discord.py"]
vision = ["torch", "transformers"]

[project.scripts]
widdx = "core.cli:run"
widdx-tui = "tui.app:run_tui"
widdx-api = "scripts.api_server:main"
widdx-web = "scripts.web_app:main"

[project.urls]
Homepage = "https://widdx.com"
Repository = "https://github.com/widdx1990/widdx-nexus"
Documentation = "https://widdx.com/docs"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "tui*", "tui/screens*", "tui/widgets*", "scripts*", "scripts/web*"]
exclude = ["tests*", "node_modules*", ".widdx*"]

[tool.setuptools.package-data]
tui = ["*.tcss"]
core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async (uses asyncio event loop)",
]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["tests/"]

[tool.coverage.run]
source = ["core", "tui"]
omit = ["tests/*", "node_modules*"]
