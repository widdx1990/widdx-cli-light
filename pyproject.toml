[project]
name = "widdx-cortex"
version = "3.0.0"
description = "WIDDX Cortex — Terminal AI Workspace with UIL Cognitive Architecture"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["ai", "chat", "cli", "tui", "terminal", "widdx", "assistant"]

authors = [
    {name = "MUHAMMAD MUSLIH (widdx)", email = "widdx@users.noreply.github.com"},
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Terminals :: Terminal Emulators/X Terminals",
]

dependencies = [
    "rich>=13.0",
    "httpx>=0.25",
    "textual>=1.0",
    "prompt_toolkit>=3.0",
    "pygments>=2.15",
    "python-bidi>=0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "build>=1.0",
    "twine>=4.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
]
gguf = ["llama-cpp-python>=0.2.0"]
all = ["widdx-cortex[dev,gguf]"]

[project.scripts]
widdx = "core.cli:run"
widdx-tui = "tui.app:run_tui"
widdx-api = "api_server:main"

[project.urls]
Homepage = "https://github.com/widdx1990/widdx-cli-light"
Repository = "https://github.com/widdx1990/widdx-cli-light"
Documentation = "https://github.com/widdx1990/widdx-cli-light#readme"

[tool.setuptools.packages.find]
include = ["core*", "cli*", "tui*", "tui/screens*", "tui/widgets*"]
exclude = ["tests*", "node_modules*", ".widdx*"]

[tool.setuptools.package-data]
tui = ["*.tcss"]
core = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "asyncio: mark test as async (uses asyncio event loop)",
]

[tool.coverage.run]
source = ["core", "tui"]
omit = ["tests/*", "node_modules*"]
